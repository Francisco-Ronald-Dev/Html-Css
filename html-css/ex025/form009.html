<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <!-- Aula 11 / Vídio 27 do Cap 24 do Modulo 4 -->
    <!-- Elemento Output em Formulários HTML-->
    <!-- Neste Exercício nos vamos usar um pouco de JavaScript-->
</head>
<body>
    <h1>Exemplo de Formulário</h1>

    <form action="cadastro.php" method="get">
        <p>
            <label for="inum">Número :</label>
            <!-- Na tag a baixo nos usamos um Pouco de JavaScript com um (input:range) que exibe o respectivo valor em um (output).-->
            <input type="range" name="num" id="inum" min="1" max="10" value="5" oninput="ival.innerHTML = Number(inum.value)">
            <output id="ival">5</output>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
