<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <!-- Aula 3 / Vídio 30 do Cap 25 do Modulo 4-->
    <!-- Estudando e aprendendo ais sobre as Multiplas Media Features com CSS.-->

    <!-- Logo a baixo nos já estamos criando os Media Queries mas eu quero chamar a atenção para uma coisa, quando atribuimos um Valor ao Parâmetro (media) e este Valor não está entre Parenteses, estamos adicionando um Media Type, se estiver entre Parenteses é um Media Feature, vejá:-->
    <link rel="stylesheet" href="estilos/style.css" media="all"> <!-- O Media Type que este "all" siguinífica que funciona em todas as telas.-->
    <link rel="stylesheet" href="estilos/retrato.css" media="screen and (orientation : portrait)">
    <link rel="stylesheet" href="estilos/paisagem.css" media="screen and (orientation : landscape)">
</head>
<body>
    <h1>Mude a Orientação do seu Dispositivo</h1>
</body>
</html>
