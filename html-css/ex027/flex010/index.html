<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <!-- Aula 9 do Cap 27 do Modulo 5 do Curso de Html 5 e Css 3-->
    <!-- Controle do tamanho de itens flexíveis - @CursoemVideo HTML5 + CSS3 -->

    <!-- Nesta aula nos vamos aprender sobre duas Propriedades, sendo elas "flex-grow" e "flex-shrink" que são duas Propriedades que se aplicam aos Filhos do Conteiner, ou seja, os Items.-->
    <style>
        div.container{
            background-color: lightsalmon;

            /* O "Flex Container" (Pai) é o elemento que recebe a Propriedade "display : flex" e controla o comportamento dos seus filhos.*/
            display: flex;

            /*Antes de começarmos quero deixar bem claro que as Propriedades que vamos ver aqui são dos Filhos e elas funcionam de forma evidente quando o Conteiner tem a Propriedade a baixo.*/
            flex-flow: row nowrap;
        }
        div.item{
            background-color: lightskyblue;
            border: 1px solid black;

            text-align: center;
            /*flex: auto;*/ /* A Propriedade "flex : auto" faz com que os Filhos possam se ajustar automaticamente dentro do seu Container.*/

            text-align: center;
            flex-basis: 250px;

            /*Por padrão os Valores destas Propriedades são estes:*/
            flex-shrink: 1;
            flex-grow: 0;

            /* agora eu vo explicar quais os valores que estas Propriedades tem.
            "flex-shrink: 1;" Aqui o Item Encolhe, este é o Padrão.
            "flex-shrink: 0;" Aqui o Item Não Encolhe.
            
            "flwx-grow: 0;" Aqui o Item Não Cresce, este é o Padrão.
            "flwx-grow: 1;" Aqui o Item Cresce.*/

            /*Obs : Se o Conteiner tiver a configuração "flex-flow: row nowrap;" então devemos tomar um certo cuidado póis se os Items tiveres as Configurações "flex-shrink: 0;" e "flex-grow: 1;" Itens crescem, mas não encolhem, podendo causar transbordamento (overflow) se o contêiner for muito pequeno.*/

            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
