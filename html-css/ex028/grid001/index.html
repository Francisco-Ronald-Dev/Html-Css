<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <!-- Aula 4 do Capítulo 28 do Modulo 5 -->
    <!-- CSS Grid Layout na prática (parte 1) - @CursoemVideo HTML5 + CSS3 -->

    <style>
        div.container{
            border: 3px solid blue;
            height: 250px;
            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;
            gap: 10px;
            /*-=-==-=-=-==-=-=-=-=-=-=-=-=*/
            /* Aula 6 do Cap 28 do Modulo 5
            CSS Grid Layout na prática (parte 2) - @CursoemVideo HTML5 + CSS3*/
            align-items: normal;
            justify-items: normal;
            align-content: normal;
            justify-content: normal;
            /*-=-==-=-=-==-=-=-=-=-=-=-=-=*/
        }
        div.item{
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <!-- A Tag (div) é um Elemento do Tipo "Block / Bloco" -->
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>

    <!-- Aula 5 do Cap 28 do Modulo 5 -->
    <!-- Propriedades de container para Grids (parte 2) - @CursoemVideo HTML5 + CSS3 -->

    <!-- Nesta Aula vimos algumas Propriedade do Grid Layout que eu vo mencionar aqui em baixo.-->

    <!-- O instrutor apresenta as seguintes propriedades:

    align-items: Alinhamento vertical dos itens.

    justify-items: Alinhamento horizontal dos itens.

    align-content: Alinhamento vertical do conteúdo (útil quando há espaço extra no contêiner).

    justify-content: Alinhamento horizontal do conteúdo (também usado quando há espaço extra).

    O vídeo utiliza um grid 3x3 como exemplo visual para demonstrar os diferentes valores que podem ser usados para essas propriedades, como stretch, start, center, end, space-between, space-evenly e space-around-->

    <!-- Obs : O Valor padrão para "align-items" e "justify-items" é "stretch", e o valor padrão para "align-content" e "justify-content" é "normal" que se comporta como um "stretch".-->
</body>
</html>
