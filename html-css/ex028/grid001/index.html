    <!-- Aula Introdutoria ao Grid Layout-->
    <!-- O que é Grid Layout? - @CursoemVideo HTML5 + CSS3 -->

    <!-- O Grid Layout é um sistema para criar Layaouts que se baseia em uma Grade Bidimensional, o Flex-Box por exemplo é um sistema que se baseia em uma Grade Unidimensional.-->

    <!-- Diferente do Flex-Box, que é um sistema Unidimensional, o Grid Layout permite que os elementos filhos de um contêiner sejam posicionados livremente em espaços criados na estrutura,que podem ter dimensões (x, y) flexíveis ou fixas. É possivel nomear as áreas da grade, facilitando a adaptação do Layout para diferentes tamanhos de tela.-->

    <!-- A Função principal deles é a seguinte : 
     
    Flexbox - é um sistema de layout unidimensional. Ele é projetado para organizar e alinhar itens ao longo de um único eixo por vez, seja horizontal (linha) ou vertical (coluna). Por isso, ele é ideal para criar componentes de interfaces menores e mais simples, como barras de navegação, galerias de imagens simples ou alinhamento de elementos dentro de um bloco maior.

    Grid Layout - é um sistema de layout bidimensional. Ele é projetado para trabalhar com linhas e colunas simultaneamente, permitindo que você crie estruturas de página complexas e bem definidas, como o esqueleto principal de um site com cabeçalho, barra lateral, área de conteúdo e rodapé. Ele oferece um controle preciso sobre o layout da página, mesmo com conteúdos de tamanhos variados.-->

    <!-- Aula 2 do Capítulo 28 do Modulo 5 -->
    <!-- A Anatomia de um Grid - @CursoemVideo HTML5 + CSS3 -->

    <!-- Os Pontos Principais sobre a anatomia dos Grid Layout são :
    
    Grid Container - É o elemento principal, o ("pai") que contém todos os elementos do Grid.

    Grid Itens - São os elementos filhos, ou seja, as áreas menores dentro do Contêiner.

    Grid Tracks - São as trilhas que formam as Linhas e Colunas da Grade. Quando temos uma Track na Horizontal chamamos de "Row Track" e quando temos uma Track na Vertical chamamos de "Column Track".
    
    Grid Lines (Horizontal) - São as Linhas que delimitam as Colunas e Linhas da Grade, ou seja elas Delimitam as Tracks Verticais, elas são numerdas Positivamente começando do 1 da Esquerda para a Direita.

    Obs : As Grid Lines (Horizontal) também podem ser "interpretadas" como um valor que começa como -1.
    
    Grid Lines (Vertical) - São as Linhas que delimitam as Tracks Horizontais, elas também começam a partir do Valor 1 e vão de Cima para Baixo.

    Obs : As Grid Lines (Vertical) também podem ser "interpretadas" como um valor que começa como -1.

    Grid Area - É um agrupamento de vários Itens da grade que são ratados como um único elemento.
    
    Grid Gap - É o espaçamento entre os Itens do Grid que pode ser ajustado sem auterar o Tamanho (Dimensão tipo x e y dos Itens) dos Elementos.-->
